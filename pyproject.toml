[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skald"
version = "0.1.0"
description = "Skald — local-first developer knowledge extraction from engineering activity"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Skald Contributors" }]
dependencies = [
    "typer>=0.12,<0.16",
    "click>=8.1,<8.2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "gitpython>=3.1,<4",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2",
    "jinja2>=3.1,<4",
    "rich>=13.0,<14",
    "pathspec>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-PyYAML",
]

[project.scripts]
skald = "skald.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/skald/cli/**" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["skald"]
mypy_path = "src"
exclude = ["alembic"]
